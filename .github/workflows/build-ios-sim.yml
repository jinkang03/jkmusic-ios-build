name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    env:
      EXPO_NO_TELEMETRY: '1'
      RCT_NEW_ARCH_ENABLED: '1'
      RCT_HERMES_V1_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Prebuild
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Pods
        working-directory: ios
        run: pod install
      - name: Build simulator app
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package app
        run: |
          APP=$(find ios/build/Build/Products -name "*.app" -type d | head -1)
          cp src/helpers/userApi/user-api-preload.js "$APP/user-api-preload.js"
          mkdir -p out && zip -qry out/JKMUSIC-simulator.app.zip "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: JKMUSIC-simulator-app
          path: out/JKMUSIC-simulator.app.zip
