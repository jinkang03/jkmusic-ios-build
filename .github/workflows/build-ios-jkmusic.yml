name: Build JKMUSIC iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      EXPO_NO_TELEMETRY: '1'
      RCT_NEW_ARCH_ENABLED: '1'
      RCT_HERMES_V1_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Ruby / CocoaPods
        run: |
          ruby --version
          sudo gem install cocoapods --no-document

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install Pods
        working-directory: ios
        run: pod install

      - name: Resolve workspace and scheme
        id: resolve
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS scheme=$SCHEME"
          if ! xcodebuild -workspace "$WS" -scheme "$SCHEME" -showBuildSettings >/dev/null 2>&1; then
            echo "scheme $SCHEME 不可用，改用工程内首个应用 target"
            PROJ=$(ls -d ios/*.xcodeproj | grep -v Pods | head -1)
            SCHEME=$(xcodebuild -project "$PROJ" -list 2>/dev/null | sed -n '/Targets:/,$p' | tail -n +2 | xargs -n1 | head -1)
          fi
          echo "final scheme=$SCHEME"
          echo "ws=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned app
        run: |
          xcodebuild -workspace "${{ steps.resolve.outputs.ws }}" \
            -scheme "${{ steps.resolve.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Verify bundle contents
        run: |
          find ios/build/Build/Products -maxdepth 3 -name "*.app" -type d || true
          APP=$(find ios/build/Build/Products -name "*.app" -type d | head -1)
          echo "app=$APP"
          [ -n "$APP" ] || { echo "未找到 .app 产物"; ls -R ios/build/Build/Products | head -30; exit 1; }
          ls -lh "$APP" | head -20

      - name: Package IPA
        run: |
          APP=$(find ios/build/Build/Products -name "*.app" -type d | head -1)
          # 自定义源脚本运行时需要的预加载脚本（原生从 Bundle 根目录查找）
          cp src/helpers/userApi/user-api-preload.js "$APP/user-api-preload.js"
          test -s "$APP/user-api-preload.js"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qry JKMUSIC-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: JKMUSIC-ios-unsigned-ipa
          path: JKMUSIC-ios-unsigned.ipa
